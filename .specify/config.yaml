project:
  name: "The Evolution of Todo"
  version: "2.0.0"
  constitution: ".specify/memory/constitution.md"

parts:
  - name: web-app
    description: "Web Application (Phases 1-3)"
    phases:
      - id: phase1-console
        name: "Phase 1: Console App"
        status: complete
        path: src/todo_app/
        description: "In-memory Python CLI with 5 CRUD features"

      - id: phase2-web
        name: "Phase 2: Full-Stack Web App"
        status: in-progress
        paths:
          backend: backend/
          frontend: frontend/
        description: "FastAPI + Next.js + Neon PostgreSQL + Better Auth"

      - id: phase3-enhanced
        name: "Phase 3: Enhanced Web Features"
        status: planned
        description: "Filtering, sorting, search, bulk operations, tags"

  - name: cloud-deployment
    description: "Cloud Deployment (Phases 4-5)"
    phases:
      - id: phase4-docker
        name: "Phase 4: Containerization"
        status: planned
        description: "Docker containers, docker-compose, CI/CD pipelines"

      - id: phase5-kubernetes
        name: "Phase 5: Kubernetes & Events"
        status: planned
        description: "K8s orchestration, event-driven architecture, AI chatbot"

specification:
  structure:
    - "features/"
    - "api/"
    - "database/"
    - "ui/"

development:
  tools:
    - "Claude Code"
    - "Spec-Kit Plus"
  stack:
    frontend: "Next.js 16+, TypeScript, Tailwind CSS, Better Auth"
    backend: "FastAPI, SQLModel, asyncpg, python-jose"
    database: "Neon Serverless PostgreSQL"
    auth: "Better Auth + JWT"
